{% extends "base.html" %}

{% block title %}Signed Out · Jimcan Operations{% endblock %}

{% block app_shell %}
<div class="min-h-screen bg-bone flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <div class="flex items-center justify-center gap-3 mb-2">
      <span class="w-10 h-10 rounded-lg bg-safety text-white flex items-center justify-center font-display text-2xl font-bold tracking-tight shadow-sm">
        J
      </span>
      <div class="text-left">
        <span class="font-display text-2xl font-bold tracking-wide text-charcoal block leading-none">JIMCAN</span>
        <span class="text-[11px] font-mono text-muted tracking-widest uppercase">Security Gateway</span>
      </div>
    </div>
  </div>

  <div class="mt-6 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="card p-6 sm:p-8 shadow-sm border border-line bg-white rounded-xl text-center space-y-5">
      
      <div class="w-14 h-14 rounded-full bg-bone text-muted flex items-center justify-center mx-auto border border-line">
        <i data-lucide="log-out" class="w-7 h-7 text-charcoal"></i>
      </div>

      <div>
        <h1 class="text-2xl font-display font-bold text-charcoal">Signed Out</h1>
        <p class="text-xs text-muted mt-2 leading-relaxed">
          Your active session has been securely terminated and cache invalidated.
        </p>
      </div>

      <div class="pt-2">
        <a href="{% url 'login' %}" class="btn btn-primary w-full text-sm font-bold flex items-center justify-center gap-2">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span>Sign In Again</span>
        </a>
      </div>

    </div>
  </div>
</div>
{% endblock app_shell %}
