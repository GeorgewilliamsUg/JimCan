{% load static %}
<!-- Minimal 56px Top Bar (Visible below 1024px only per Section 5) -->
<header class="mobile-topbar" aria-label="Mobile navigation header">
  <div class="flex items-center gap-3">
    <!-- Hamburger button to open mobile off-canvas drawer -->
    <button type="button"
            @click="sidebarDrawerOpen = true"
            class="p-2 rounded"
            style="color: var(--text-on-dark); background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;"
            aria-label="Open sidebar">
      <i data-lucide="menu" class="w-5 h-5"></i>
    </button>
    <a href="{% url 'dashboard:overview' %}" class="flex items-center gap-2 no-underline">
      <img src="{% static 'img/favicon/logo.png' %}" alt="Jimcan logo" class="h-7 w-7 object-contain">
      <span class="font-display font-semibold text-sm" style="color: var(--text-on-dark);">Jimcan</span>
    </a>
  </div>
</header>
