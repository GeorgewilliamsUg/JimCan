<!-- Top Enterprise Header Bar -->
<header class="h-16 flex items-center justify-between px-6 bg-white/95 backdrop-blur-md border-b border-slate-200/80 shadow-[0_1px_2px_0_rgba(0,0,0,0.03)] flex-shrink-0">
  <!-- Left Side: Mobile Hamburger & Context Breadcrumbs -->
  <div class="flex items-center gap-4 min-w-0">
    <!-- Mobile Hamburger Toggle (hidden on desktop) -->
    <button type="button" 
            @click="sidebarOpen = true" 
            class="md:hidden -ml-2 p-2 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500/20" 
            aria-label="Open sidebar">
      <i data-lucide="menu" class="w-5 h-5"></i>
    </button>

    <!-- Context / Location -->
    <div class="flex items-center gap-2 text-sm text-slate-500 truncate">
      <span class="font-medium text-slate-600 hidden sm:inline">Jimcan Operations</span>
      <span class="text-slate-300 hidden sm:inline">/</span>
      <span class="font-semibold text-slate-900 truncate">{{ page_title|default:"Overview" }}</span>
    </div>
  </div>

  <!-- Right Side: Status, Active Role Indicator & Actions -->
  <div class="flex items-center gap-3">
    <!-- Live Platform Status Indicator -->
    <div class="hidden sm:flex items-center gap-2 px-3 py-1 rounded-full text-xs font-mono font-medium bg-emerald-50 text-emerald-800 border border-emerald-200/80 shadow-xs">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span>Live · EAT (UTC+3)</span>
    </div>

    <!-- Role Badge -->
    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 border border-slate-200/80 shadow-xs">
      <i data-lucide="shield" class="w-3.5 h-3.5 text-slate-500"></i>
      <span>{{ current_role_display }}</span>
    </span>
  </div>
</header>
